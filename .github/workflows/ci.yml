name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Root (frontend) ──
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (frontend)
        run: npm test

      - name: Build
        run: npm run build

      # ── Functions (backend) ──
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Lint functions
        working-directory: functions
        run: npm run lint

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Test functions (unit)
        working-directory: functions
        run: npx vitest run test/attendance-logic.test.ts

      - name: Set up Java (required for Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test functions (integration – Firestore rules)
        working-directory: functions
        run: |
          npx firebase-tools@15 emulators:exec \
            --project demo-test \
            --only firestore \
            "npx vitest run test/firestore.rules.test.ts"
